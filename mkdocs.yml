site_name: DYSAIT
site_description: Desenvolvimento de sistemas Web e Sites
docs_dir: documentacao/docs
site_dir: documentacao/site-docs

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Negócio:
      - Mercado e nicho: negocio/mercado.md
      - Modelo de negócio: negocio/escada.md
      - Níveis e preços: negocio/niveis.md
      - Catálogo de automação: negocio/catalogo.md
  - Site:
      - Site de apresentação: site/apresentacao.md
  - Validação:
      - Métodos: validacao/metodos.md
      - Experimentos: validacao/experimentos.md
  - Vendas:
      - Prospecção e venda: vendas/prospeccao.md
  - Entrega:
      - Implantação: entrega/sop.md
      - Operação de automação: entrega/automacao.md
  - Operação:
      - Suporte de TI: operacao/suporte.md
      - Contratos e escopo: operacao/contratos.md
      - Stack e plataforma: operacao/plataforma.md
  - Financeiro:
      - Números: financeiro/numeros.md
      - Riscos: financeiro/riscos.md
      - KPIs: financeiro/kpis.md
  - Plano:
      - Roadmap: plano/roadmap.md
  - Produto e plano B (opcional):
      - Produto SaaS: produto/saas.md
      - Plano B (white-label): produto/plano-b.md
